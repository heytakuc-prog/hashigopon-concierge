<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>はしごポンに聞いてみよう！</title>
  <style>
    :root {
      --ink: #2b2018;
      --muted: #6e5e52;
      --paper: #fffaf0;
      --panel: #fffdf7;
      --line: #ead6b8;
      --night: #283650;
      --beer: #f2a51f;
      --red: #cc3f49;
      --green: #4f9459;
      --aqua: #1e8f8f;
      --shadow: 0 18px 44px rgba(43, 32, 24, 0.16);
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      color: var(--ink);
      font-family: "Yu Gothic", "Hiragino Sans", "Noto Sans JP", system-ui, sans-serif;
      background:
        radial-gradient(circle at 18% 8%, rgba(242, 165, 31, 0.28), transparent 25%),
        radial-gradient(circle at 90% 12%, rgba(204, 63, 73, 0.16), transparent 24%),
        linear-gradient(155deg, #fff2d3 0%, #fffaf0 48%, #e8f2ed 100%);
    }

    button { font: inherit; cursor: pointer; }

    .page {
      width: min(100%, 1040px);
      min-height: 100vh;
      margin: 0 auto;
      padding: 14px;
    }

    .topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 8px;
      color: #fff;
      background: rgba(40, 54, 80, 0.96);
      box-shadow: 0 10px 26px rgba(40, 54, 80, 0.18);
      font-size: 13px;
      font-weight: 800;
    }

    .topbar span:last-child {
      color: #ffe2a1;
      text-align: right;
      font-size: 12px;
    }

    .main {
      display: grid;
      grid-template-columns: minmax(0, 0.9fr) minmax(320px, 470px);
      gap: 20px;
      align-items: center;
      min-height: calc(100vh - 56px);
    }

    .hero-copy {
      padding: 10px 2px 26px;
    }

    .hero-banner {
      display: block;
      width: 100%;
      max-width: 720px;
      border: 2px solid rgba(43, 32, 24, 0.18);
      border-radius: 8px;
      box-shadow: var(--shadow);
    }

    .pon-stage {
      display: grid;
      grid-template-columns: 160px 1fr;
      gap: 14px;
      align-items: end;
      max-width: 520px;
      margin-top: 14px;
    }

    .hashigopon {
      width: 100%;
      filter: drop-shadow(0 18px 24px rgba(77, 45, 23, 0.2));
    }

    .status-card {
      padding: 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.84);
      box-shadow: var(--shadow);
    }

    .status-card strong {
      display: block;
      margin-bottom: 6px;
      color: var(--red);
      font-size: 14px;
    }

    .status-card p {
      margin: 0;
      color: var(--muted);
      line-height: 1.7;
      font-size: 14px;
      font-weight: 700;
    }

    .panel {
      align-self: center;
      display: flex;
      flex-direction: column;
      padding: 14px;
      border: 2px solid rgba(234, 214, 184, 0.95);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.94);
      box-shadow: var(--shadow);
    }

    .progress {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
      color: var(--muted);
      font-size: 12px;
      font-weight: 900;
    }

    .dots {
      display: flex;
      gap: 5px;
      flex-wrap: wrap;
      justify-content: flex-end;
    }

    .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #e3cfad;
    }

    .dot.active { background: var(--beer); }

    .conversation {
      flex: 0 1 auto;
      max-height: 46vh;
      overflow-y: auto;
      padding: 6px 2px 14px;
    }

    .pon-message,
    .user-message {
      display: flex;
      align-items: flex-end;
      gap: 8px;
      margin: 10px 0;
    }

    .pon-face {
      flex: 0 0 48px;
      width: 48px;
      height: 48px;
      object-fit: contain;
      filter: drop-shadow(0 6px 10px rgba(77, 45, 23, 0.12));
    }

    .pon-bubble,
    .user-bubble {
      max-width: min(78%, 360px);
      padding: 12px 14px;
      border-radius: 8px;
      font-size: 15px;
      line-height: 1.65;
      font-weight: 800;
    }

    .pon-bubble {
      border: 1px solid #ead6b8;
      background: #fff;
      box-shadow: 0 8px 18px rgba(43, 32, 24, 0.08);
    }

    .user-message {
      justify-content: flex-end;
    }

    .user-bubble {
      color: #fff;
      background: var(--night);
    }

    .typing {
      display: none;
      align-items: center;
      gap: 5px;
      width: max-content;
      margin: 0 0 10px 56px;
      padding: 10px 12px;
      border-radius: 8px;
      background: #fff;
      border: 1px solid var(--line);
    }

    .typing.show { display: flex; }

    .typing span {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--beer);
      animation: pulse 0.9s infinite ease-in-out;
    }

    .typing span:nth-child(2) { animation-delay: 0.14s; }
    .typing span:nth-child(3) { animation-delay: 0.28s; }

    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: translateY(0); }
      50% { opacity: 1; transform: translateY(-3px); }
    }

    .answers {
      display: grid;
      grid-template-columns: 1fr;
      gap: 9px;
      padding-top: 12px;
      border-top: 1px dashed #dcc39d;
    }

    .answer-button,
    .secondary {
      min-height: 48px;
      padding: 12px 14px;
      border-radius: 8px;
      border: 2px solid #d5b37b;
      color: var(--ink);
      background: #fff8e9;
      text-align: left;
      font-weight: 900;
      line-height: 1.35;
      box-shadow: 0 6px 0 #d5b37b;
      transition: transform 0.12s ease, box-shadow 0.12s ease, background 0.12s ease;
    }

    .answer-button:active,
    .secondary:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 #d5b37b;
    }

    .answer-button.primary {
      color: #fff;
      background: var(--red);
      border-color: #9e2f39;
      box-shadow: 0 6px 0 #9e2f39;
    }

    .request-box {
      display: grid;
      gap: 10px;
    }

    .request-input {
      width: 100%;
      min-height: 108px;
      resize: vertical;
      padding: 12px 14px;
      border: 2px solid #d5b37b;
      border-radius: 8px;
      color: var(--ink);
      background: #fffdf7;
      font: inherit;
      font-weight: 800;
      line-height: 1.6;
      outline: none;
      box-shadow: inset 0 2px 8px rgba(43, 32, 24, 0.08);
    }

    .request-input:focus {
      border-color: var(--beer);
      box-shadow: 0 0 0 4px rgba(242, 165, 31, 0.22);
    }

    .request-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 9px;
    }

    .thinking {
      display: none;
      margin-top: 14px;
      padding: 14px;
      border-radius: 8px;
      color: #fff;
      background: var(--night);
      font-weight: 900;
      line-height: 1.6;
    }

    .thinking.show { display: block; }

    .results {
      display: none;
      margin-top: 18px;
      padding-bottom: 36px;
    }

    .results.show { display: block; }

    .diagnosis {
      display: grid;
      grid-template-columns: 76px 1fr;
      gap: 12px;
      align-items: center;
      margin-bottom: 14px;
      padding: 14px;
      border: 2px solid var(--line);
      border-radius: 8px;
      background: rgba(255, 253, 247, 0.96);
      box-shadow: var(--shadow);
    }

    .diagnosis img {
      width: 76px;
    }

    .diagnosis h2 {
      margin: 0 0 6px;
      font-size: 21px;
    }

    .diagnosis p {
      margin: 0;
      color: var(--muted);
      line-height: 1.65;
      font-weight: 800;
    }

    .store-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .store-card {
      overflow: hidden;
      border: 2px solid rgba(234, 214, 184, 0.98);
      border-radius: 8px;
      background: #fffdf7;
      box-shadow: 0 14px 34px rgba(43, 32, 24, 0.14);
    }

    .store-photo {
      min-height: 118px;
      padding: 12px;
      color: #fff;
      background: linear-gradient(135deg, var(--night), var(--red));
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      gap: 8px;
      font-weight: 900;
    }

    .store-photo .genre {
      padding: 6px 8px;
      border-radius: 999px;
      background: rgba(255, 255, 255, 0.22);
      font-size: 12px;
    }

    .score {
      width: 70px;
      height: 70px;
      border-radius: 50%;
      display: grid;
      place-items: center;
      color: var(--ink);
      background: #fff3c9;
      border: 3px solid #fff;
      font-size: 18px;
      font-weight: 1000;
    }

    .store-body {
      padding: 13px;
    }

    .store-body h3 {
      margin: 0 0 6px;
      font-size: 19px;
      line-height: 1.3;
    }

    .recommend-type {
      display: inline-block;
      margin-bottom: 8px;
      padding: 4px 8px;
      border-radius: 999px;
      color: #fff;
      background: var(--green);
      font-size: 12px;
      font-weight: 900;
    }

    .reason,
    .owner-comment {
      margin: 0 0 10px;
      color: var(--muted);
      line-height: 1.65;
      font-size: 13px;
      font-weight: 800;
    }

    .owner-comment {
      padding: 10px;
      border-left: 4px solid var(--beer);
      background: #fff7e3;
    }

    .facts {
      display: grid;
      gap: 6px;
      margin: 10px 0;
      color: var(--ink);
      font-size: 13px;
      font-weight: 900;
    }

    .tags {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      margin: 10px 0;
    }

    .tag {
      padding: 4px 7px;
      border-radius: 999px;
      color: var(--night);
      background: #f4ead9;
      font-size: 12px;
      font-weight: 900;
    }

    .card-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 12px;
    }

    .card-actions a {
      display: grid;
      place-items: center;
      min-height: 42px;
      border-radius: 8px;
      color: #fff;
      background: var(--night);
      text-decoration: none;
      font-size: 13px;
      font-weight: 900;
    }

    .card-actions a.instagram {
      background: var(--red);
    }

    .feedback {
      margin-top: 16px;
      padding: 14px;
      border-radius: 8px;
      background: var(--night);
      color: #fff;
    }

    .feedback-inner {
      display: grid;
      grid-template-columns: 88px 1fr;
      gap: 12px;
      align-items: center;
    }

    .feedback img {
      width: 88px;
    }

    .feedback h2 {
      margin: 0 0 10px;
      font-size: 22px;
    }

    .feedback-options {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .feedback-options button,
    .again-row button {
      min-height: 44px;
      border: 0;
      border-radius: 8px;
      color: var(--ink);
      background: #fff3c9;
      font-weight: 1000;
    }

    .again-row {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .again-row button {
      padding: 0 14px;
      color: #fff;
      background: var(--red);
    }

    .toast {
      position: fixed;
      left: 50%;
      bottom: 18px;
      z-index: 10;
      transform: translateX(-50%) translateY(16px);
      opacity: 0;
      min-width: min(92vw, 360px);
      padding: 12px 14px;
      border-radius: 8px;
      color: #fff;
      background: rgba(40, 54, 80, 0.96);
      text-align: center;
      font-weight: 900;
      transition: 0.2s ease;
      pointer-events: none;
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 860px) {
      .main {
        grid-template-columns: 1fr;
        min-height: auto;
      }

      .hero-copy {
        padding-bottom: 0;
      }

      .hero-banner {
        max-width: 100%;
      }

      .store-grid {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 520px) {
      .page { padding: 10px; }

      .topbar {
        align-items: flex-start;
        flex-direction: column;
      }

      .pon-stage {
        grid-template-columns: 110px 1fr;
      }

      .panel {
        padding: 12px;
      }

      .conversation {
        max-height: 50vh;
      }

      .pon-bubble,
      .user-bubble {
        max-width: calc(100% - 58px);
        font-size: 14px;
      }

      .feedback-inner,
      .diagnosis {
        grid-template-columns: 64px 1fr;
      }

      .feedback img,
      .diagnosis img {
        width: 64px;
      }

      .feedback-options {
        grid-template-columns: 1fr;
      }

      .request-actions {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>
<body>
  <div class="page">
    <div class="topbar">
      <span>松戸クラフトビールフェス はしご酒コンシェルジュ</span>
      <span>選んで遊ぶ V1</span>
    </div>

    <main class="main">
      <section class="hero-copy" aria-label="アプリ紹介">
        <img class="hero-banner" src="./assets/hashigopon-banner.png" alt="はしごポンに聞いてみよう！ 松戸のおいしい一軒を探すポン">
        <div class="pon-stage">
          <img class="hashigopon" id="ponImage" src="./assets/hashigopon-normal.png" alt="はしごポン">
          <div class="status-card">
            <strong>はしごポンのプロフィール</strong>
            <p>松戸の夜と街歩きが好きな、おせっかい案内役。口は悪いが粋な奴。お酒は好きだけど無理にはすすめない。イベント帰りの「もう一軒」を、楽しく一緒に考えます。</p>
          </div>
        </div>
      </section>

      <section class="panel" id="questionArea" aria-label="はしごポンとの会話">
        <div class="progress">
          <span id="progress">準備中</span>
          <div class="dots" id="dots" aria-hidden="true"></div>
        </div>
        <div class="conversation" id="conversation"></div>
        <div class="typing" id="typing" aria-hidden="true"><span></span><span></span><span></span></div>
        <div class="answers" id="answers"></div>
        <div class="thinking" id="thinking">はしごポンが松戸の夜を思い出しています...</div>
      </section>
    </main>

    <section class="results" id="results" aria-label="おすすめ結果">
      <div class="diagnosis">
        <img src="./assets/hashigopon-recommend.png" alt="おすすめするはしごポン">
        <div>
          <h2 id="diagnosisTitle">今のあなたにおすすめ</h2>
          <p id="diagnosisText"></p>
        </div>
      </div>
      <div class="store-grid" id="storeGrid"></div>
      <div class="feedback">
        <div class="feedback-inner">
          <img src="./assets/hashigopon-satisfied.png" alt="満足げなはしごポン">
          <div>
            <h2>で、どうだった？</h2>
            <div class="feedback-options">
              <button type="button" data-feedback="good">いい感じ</button>
              <button type="button" data-feedback="bad">ちょっと違う</button>
              <button type="button" id="retryButton">もう一回やる</button>
            </div>
          </div>
        </div>
      </div>
      <div class="again-row">
        <button type="button" id="randomButton">おまかせで3軒見る</button>
      </div>
    </section>
  </div>

  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script type="module" src="./app-v1.js"></script>
</body>
</html>
